name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo:
    name: Repo rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Skills, manifests, README and evals
        run: node scripts/validate.mjs
      - name: Tests for the rules
        run: node --test scripts/validate.test.mjs

  spec:
    name: Agent Skills spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Validate each skill with the reference validator
        run: |
          for skill in skills/*/; do
            uvx --from skills-ref==0.1.1 agentskills validate "$skill"
          done

  claude-plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      # Not --strict: the plugin has no "version" on purpose, so every commit on main is a new version.
      - name: Validate the plugin and its marketplace
        run: npx --yes @anthropic-ai/claude-code@2.1.308 plugin validate .
